name: Generate Python UML
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-uml:
    name: 'Generate Reaper Controller UML'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      UML_OUTPUT_PATH: "./docs/UMLs/"
      UML_FILE_NAME: "SoundscapeReapyController-UML"
      IGNORE_DIRS: "tests,__pycache__"

    steps:
      - uses: actions/checkout@v4
 
      - name: Remove old diagram
        run: |
          rm -f "${{ env.UML_OUTPUT_PATH }}${{ env.UML_FILE_NAME }}.puml" \
                "${{ env.UML_OUTPUT_PATH }}${{ env.UML_FILE_NAME }}.svg"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pyreverse (via pylint) and PlantUML
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml
          pip install pylint

      - name: Create output folder
        run: mkdir -p "${{ env.UML_OUTPUT_PATH }}"

      - name: Generate PlantUML source
        # pyreverse must be given each package/module: handed the repo root it treats it
        # as a single package, fails to import it and emits an empty diagram (with exit 0).
        # -o puml  : emit PlantUML source rather than a rendered image
        # -p NAME  : project name, used in output filename (classes_NAME.puml)
        # --ignore : comma-separated file/dir basenames to skip (applies recursively)
        # -d       : output directory
        run: |
          targets=(*.py)
          for dir in */; do
            [ -f "${dir}__init__.py" ] && targets+=("${dir%/}")
          done
          echo "Analysing: ${targets[*]}"

          pyreverse -o puml -p "${{ env.UML_FILE_NAME }}" \
            --ignore="${{ env.IGNORE_DIRS }}" \
            -d "${{ env.UML_OUTPUT_PATH }}" \
            "${targets[@]}"

          # pyreverse always produces two files: classes_NAME.puml and packages_NAME.puml.
          # We only want the class diagram, renamed to the requested filename.
          mv "${{ env.UML_OUTPUT_PATH }}classes_${{ env.UML_FILE_NAME }}.puml" \
             "${{ env.UML_OUTPUT_PATH }}${{ env.UML_FILE_NAME }}.puml"
          rm -f "${{ env.UML_OUTPUT_PATH }}packages_${{ env.UML_FILE_NAME }}.puml"

          # PlantUML names its output after the diagram name on the @startuml line, not
          # after the file, so keep the two in step or we'd render classes_NAME.svg.
          sed -i "s|^@startuml .*|@startuml ${{ env.UML_FILE_NAME }}|" \
            "${{ env.UML_OUTPUT_PATH }}${{ env.UML_FILE_NAME }}.puml"

          # Group the classes into package boxes, and add <<module>> nodes for class-less
          # modules (the SoundscapeVReapy entry point), which pyreverse cannot draw.
          python .github/scripts/postprocess_puml.py \
            "${{ env.UML_OUTPUT_PATH }}${{ env.UML_FILE_NAME }}.puml" \
            --ignore="${{ env.IGNORE_DIRS }}" \
            "${targets[@]}"

      - name: Render PlantUML to SVG
        run: |
          puml="${{ env.UML_OUTPUT_PATH }}${{ env.UML_FILE_NAME }}.puml"

          # pyreverse exits 0 even when it parsed nothing, so an empty diagram would be
          # committed silently. Catch that here instead.
          if ! grep -q '^class ' "$puml"; then
            echo "::error::Generated class diagram contains no classes."
            exit 1
          fi

          plantuml -tsvg "$puml"

      - uses: EndBug/add-and-commit@v9
        with:
          author_name: 'UML Bot'
          message: 'Generate Python UML (${{ github.workflow }})'
          author_email: 41898282+uml-bot[bot]@users.noreply.github.com

