name: Generate Python UML
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-uml:
    name: 'Generate Reaper Controller UML'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      UML_OUTPUT_PATH: "./docs/UMLs/"
      UML_FILE_NAME: "SoundscapeReapyController-UML"
      IGNORE_DIRS: "tests,__pycache__"

    steps:
      - uses: actions/checkout@v4
 
      - name: Remove old diagram
        run: rm -f "${{ env.UML_OUTPUT_PATH }}${{ env.UML_FILE_NAME }}.svg" || true
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Install pyreverse (via pylint) and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          pip install pylint
 
      - name: Create output folder
        run: mkdir -p "${{ env.UML_OUTPUT_PATH }}"
 
      - name: Generate UML class diagram
        # pyreverse must be given each package/module: handed the repo root it treats it
        # as a single package, fails to import it and emits an empty diagram (with exit 0).
        # -o svg   : output format
        # -p NAME  : project name, used in output filename (classes_NAME.svg)
        # --ignore : comma-separated file/dir basenames to skip (applies recursively)
        # -d       : output directory
        run: |
          targets=(*.py)
          for dir in */; do
            [ -f "${dir}__init__.py" ] && targets+=("${dir%/}")
          done
          echo "Analysing: ${targets[*]}"

          pyreverse -o svg -p "${{ env.UML_FILE_NAME }}" \
            --ignore="${{ env.IGNORE_DIRS }}" \
            -d "${{ env.UML_OUTPUT_PATH }}" \
            "${targets[@]}"

      - name: Rename output and drop the packages diagram
        run: |
          # pyreverse always produces two files: classes_NAME.svg and packages_NAME.svg.
          # We only want the class diagram, renamed to the requested filename.
          classes="${{ env.UML_OUTPUT_PATH }}classes_${{ env.UML_FILE_NAME }}.svg"

          # pyreverse exits 0 even when it parsed nothing, so an empty diagram would be
          # committed silently. Catch that here instead.
          if ! grep -q '<g id="node' "$classes"; then
            echo "::error::Generated class diagram contains no classes."
            exit 1
          fi

          mv "$classes" "${{ env.UML_OUTPUT_PATH }}${{ env.UML_FILE_NAME }}.svg"
          rm -f "${{ env.UML_OUTPUT_PATH }}packages_${{ env.UML_FILE_NAME }}.svg"
 
      - uses: EndBug/add-and-commit@v9
        with:
          author_name: 'UML Bot'
          message: 'Generate Python UML (${{ github.workflow }})'
          author_email: 41898282+uml-bot[bot]@users.noreply.github.com

